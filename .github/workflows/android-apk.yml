name: DEEPWILD Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deepwild-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Validate project and export Android APK
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.5.1
    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      ANDROID_HOME: /usr/lib/android-sdk
      ANDROID_SDK_ROOT: /usr/lib/android-sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install required system packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends fontconfig openjdk-17-jdk unzip curl
          java -version
          test -d "$JAVA_HOME"
          test -d "$ANDROID_HOME"

      - name: Install matching Godot export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.5.1.stable"
          curl -fL --retry 3             https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz             -o /tmp/godot-templates.tpz
          unzip -o /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.5.1.stable/"
          test -s "$HOME/.local/share/godot/export_templates/4.5.1.stable/android_debug.apk"
          test -s "$HOME/.local/share/godot/export_templates/4.5.1.stable/android_release.apk"

      - name: Configure Godot Android SDK paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF
          cat "$HOME/.config/godot/editor_settings-4.tres"

      - name: Verify project files
        run: |
          test -f project.godot
          test -f scenes/main.tscn
          test -f scripts/main.gd
          test -f export_presets.cfg
          echo "Project files found."

      - name: Validate Godot project
        run: godot --headless --editor --path . --quit

      - name: Export Android ARM64 APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/DEEPWILD-Shattered-Lands.apk

      - name: Verify APK
        run: |
          test -s build/DEEPWILD-Shattered-Lands.apk
          file build/DEEPWILD-Shattered-Lands.apk
          ls -lh build/DEEPWILD-Shattered-Lands.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DEEPWILD-Shattered-Lands-Android-APK
          path: build/DEEPWILD-Shattered-Lands.apk
          if-no-files-found: error
          retention-days: 14
