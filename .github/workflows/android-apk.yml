name: DEEPWILD Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deepwild-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Validate project and export Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Install Android SDK platform and build tools
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "JAVA_HOME=$JAVA_HOME"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -d "$ANDROID_HOME/platforms/android-35"

      - name: Install Godot 4.5.1 and matching export templates
        run: |
          mkdir -p "$HOME/godot" "$HOME/.local/share/godot/export_templates/4.5.1.stable"
          curl -fL --retry 3 https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d "$HOME/godot"
          sudo install -m 0755 "$HOME/godot/Godot_v4.5.1-stable_linux.x86_64" /usr/local/bin/godot
          curl -fL --retry 3 https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz -o /tmp/godot-templates.tpz
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.5.1.stable/"
          godot --version
          echo "=== Export templates ==="
          ls -lah "$HOME/.local/share/godot/export_templates/4.5.1.stable/"
          test "$(cat "$HOME/.local/share/godot/export_templates/4.5.1.stable/version.txt")" = "4.5.1.stable"
          test -s "$HOME/.local/share/godot/export_templates/4.5.1.stable/android_debug.apk"
          test -s "$HOME/.local/share/godot/export_templates/4.5.1.stable/android_release.apk"
          test -s "$HOME/.local/share/godot/export_templates/4.5.1.stable/android_source.zip"

      - name: Prepare Android debug keystore and configure Godot
        run: |
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
          cat > "$HOME/.config/godot/editor_settings-4.5.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          # Also put the debug signing values in the preset itself so validation
          # does not depend on fallback behavior in EditorSettings.
          python3 - <<'PY'
          import os
          from pathlib import Path
          preset = Path("export_presets.cfg")
          content = preset.read_text()
          key = f'{os.environ["HOME"]}/.android/debug.keystore'
          signing = (
              f'keystore/debug="{key}"\n'
              'keystore/debug_user="androiddebugkey"\n'
              'keystore/debug_password="android"\n'
          )
          if 'keystore/debug="' not in content:
              content = content.replace('package/signed=true\n', 'package/signed=true\n' + signing, 1)
          preset.write_text(content)
          PY
          echo "=== Godot Android settings ==="
          cat "$HOME/.config/godot/editor_settings-4.5.tres"
          grep -E '^(keystore/debug|keystore/debug_user|keystore/debug_password)=' export_presets.cfg
          test -s "$HOME/.android/debug.keystore"

      - name: Validate Godot project
        run: |
          set -o pipefail
          godot --headless --verbose --editor --path . --quit 2>&1 | tee /tmp/godot-validation.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script" /tmp/godot-validation.log; then
            echo "Godot reported a script loading or parse error."
            exit 1
          fi

      - name: Export Android ARM64 APK
        run: |
          set -o pipefail
          echo "=== Java and Android SDK ==="
          java -version
          ls -ld "$JAVA_HOME" "$ANDROID_HOME" "$ANDROID_HOME/platform-tools" "$ANDROID_HOME/platforms/android-35" "$ANDROID_HOME/build-tools/35.0.0"
          ls -l "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          echo "=== Export Android debug APK ==="
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/DEEPWILD-Shattered-Lands.apk 2>&1 | tee /tmp/godot-android-export.log

      - name: Verify APK
        run: |
          test -s build/DEEPWILD-Shattered-Lands.apk
          file build/DEEPWILD-Shattered-Lands.apk
          ls -lh build/DEEPWILD-Shattered-Lands.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging build/DEEPWILD-Shattered-Lands.apk | head -n 8

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DEEPWILD-Shattered-Lands-Android-APK
          path: build/DEEPWILD-Shattered-Lands.apk
          if-no-files-found: error
          retention-days: 14
